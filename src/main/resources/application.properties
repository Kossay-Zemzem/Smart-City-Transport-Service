spring.application.name=transport

#automatically update the database schema
spring.jpa.hibernate.ddl-auto=create-drop
#show SQL queries in console
spring.jpa.show-sql=true
#-----------------------------------------------------------------

#-------------------------------------------------
#  Paramètres de la base de données
#-------------------------------------------------
# URL de la base de données (MySQL),modifiez l'URL selon votre base de données
spring.datasource.url=jdbc:mysql://localhost:3306/smartcity_transport_db
# Nom d'utilisateur de la base de données (à définir dans les variables d'environnement du system)
spring.datasource.username=${MYSQL_DB_USER}
# Mot de passe de la base de données (à définir dans les variables d'environnement du system)
spring.datasource.password=${MYSQL_DB_PASSWORD}

#-------------------------------------------------
#  Paramètres de l'application
#-------------------------------------------------
#base url (so all endpoints start with /transport)
#server.servlet.context-path=/transport

# Port utilisé par l'application (modifiez si nécessaire)
server.port = 8081
# Adresse IP du serveur (optionnel, par défaut utilise address ip locale). Enlever le "#" pour defenir address ip.
# server.address = 0.0.0.0

#-------------------------------------------------
# Eureka microservice registration Configuration
#-------------------------------------------------
# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance Configuration
#eureka.instance.prefer-ip-address=true
#eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
